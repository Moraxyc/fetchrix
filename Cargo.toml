[package]
name = "fetchrix"
version = "0.1.0"
edition = "2024"
description = "Update package sources and derived hashes for Nix"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moraxyc/fetchrix"

[dependencies]
bzip2 = "0.6"
flate2 = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = [
  "std",
  "xz",
  "optimization",
] }
clap = { version = "4", features = ["derive", "env"] }
miette = { version = "7", features = ["fancy"] }
nix-compat = { git = "https://git.snix.dev/snix/snix.git", default-features = false }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tar = "0.4"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "gzip",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "process",
  "fs",
  "io-util",
] }
toml = "1"
indicatif = "0.18.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
