name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: [ci]
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}
      - uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: ${{ vars.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - name: Check version
        run: |
          version=$(nix eval --raw .#fetchrix.version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build
        run: |
          bin=$(nix build -L .#fetchrix-static --print-out-paths)
          mkdir -p dist/bin
          install -m755 "$bin/bin/fetchrix" "dist/bin/fetchrix-${{ matrix.system }}"
          if [ "$RUNNER_OS" = Linux ]; then
            deb=$(nix build -L .#fetchrix-deb --print-out-paths)
            install -Dm644 -t dist/deb "$deb"/*.deb
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetchrix-${{ matrix.system }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: fetchrix
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          (cd dist/bin && sha256sum -- *) > SHA256SUMS
          (cd dist/deb && sha256sum -- *.deb) >> SHA256SUMS
      - name: APT manifest
        run: |
          for operation in manifest verify-artifacts; do
            nix run --inputs-from ./nix/dev moraxyc-repo#moraxyc-repo -- \
              "$operation" --artifacts dist/deb --project "$PROJECT_ID" --tag "$RELEASE_TAG"
          done
      - name: Release notes
        run: nix run --inputs-from . nixpkgs#git-cliff -- --latest --strip header --output notes.md
      - name: Create GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file notes.md \
            dist/bin/* dist/deb/* SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
